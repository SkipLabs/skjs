  - id: L-LIT
    kind: assumption
    table: main
    short: >-
      Literal spellings: (i) $\delta$ is a function; (ii) injectivity
      modulo $\approx$ after normalization; (iii) falsiness-exactness of
      the lexeme test.
    statement: >-
      Three claims about literal spellings: (i) $\delta$ is a function —
      definitional, used by R2; (ii) \emph{injectivity modulo $\approx$}
      after normalization — needed only for \emph{exactness} claims; (iii)
      \emph{falsiness-exactness}: the lexeme test \texttt{isFalsy} agrees
      with Definition~\ref{def:truthiness} — needed by the residue lemma
    anchor: \texttt{normalizeJSNumber}/\texttt{normalizeJSBigInt}; \texttt{isFalsy}; \texttt{unquoteString}
    anchor_files: [src/JSNumericString.sk, src/ParserUtils.sk, src/TType.sk, src/PrimLiterals.sk]
    status: [violated]
    status_note: >-
      (i) \textsc{proved} (definitional). For num/bigint, (ii)/(iii) are
      \textsc{proved} for \emph{within-precision} literals: normalized to
      canonical form at parse time
      (\texttt{normalizeJSNumber}/\texttt{normalizeJSBigInt}), so on that
      range zero has one spelling per kind and injectivity holds. For
      \emph{beyond-precision} numeric literals — those failing the
      round-trip $\mathtt{String(Number(s))} = s$: 16--17-digit decimals,
      radix forms $> 2^{53}$, over/underflow exponent forms — (ii)/(iii)
      are \textsc{violated}: distinct spellings of one double are kept
      distinct, so \texttt{===} narrowing yields a spurious \texttt{never}
      (ii), and the normalizer can emit a zero-denoting lexeme
      (\texttt{1e-400}, underflow to $+0$) classified truthy (iii) — both
      witnessed end-to-end (issue draft
      \texttt{beyond-precision-numeric-literals.md}). For the
      \emph{string} kind, (ii)/(iii) are \textsc{violated}: escapes are
      stored undecoded (\texttt{unquoteString}; issue draft
      \texttt{string-literal-escapes-undecoded.md}), so distinct spellings
      of one string are treated as distinct (ii), and a line-continuation
      lexeme denotes \texttt{""} yet is classified truthy (iii) — both
      witnessed end-to-end. All other results are unconditional
    summary:
      - {bucket: violated-witnessed,
         label: "L-LIT(ii)/(iii) string-kind (undecoded escapes) + num
           beyond-precision spellings"}
    owner: G
    consumers: [B, D]
    issues: [string-literal-escapes-undecoded.md,
             beyond-precision-numeric-literals.md]


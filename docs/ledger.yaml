  - id: L-SEQ
    kind: assumption
    table: main
    short: Type denotations used as equality RHSs are $\approx$-closed.
    statement: Type denotations used as equality RHSs are $\approx$-closed
    anchor: \texttt{evalVarEquality}
    anchor_files: [src/TypeCheckRefine.sk]
    status: [violated]
    status_note: >-
      \textsc{violated}, witnessed end-to-end at the undefined/\texttt{void}
      corner (\S\ref{sec:ex-voidseq}; issue draft
      \texttt{void-undefined-equality-never.md}): \texttt{evalVarEquality}'s
      generic variable-RHS arm installs
      $\mathtt{inter}(\texttt{void},\texttt{undefined}) = \texttt{never}$
      while $\approx$ relates the two units, and the \texttt{void}-operand
      check on \texttt{===} is a warning, so the corner is reachable — the
      branch runs with \texttt{undefined} bound at \texttt{never}. The
      undefined-\emph{literal} arm filters the units jointly and is sound;
      literal/full primitives and objects remain $\approx$-closed by
      construction
    summary:
      - {bucket: violated-witnessed,
         label: "L-SEQ's undefined/\\texttt{void} corner"}
    owner: main
    consumers: []
    issues: [void-undefined-equality-never.md]


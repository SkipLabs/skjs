    summary: [{bucket: proved, label: "inference growth preserves types computed earlier (L-MONO)"}]
    owner: E
    consumers: [C, F]
    issues: []

  - id: L-SEQ
    kind: assumption
    table: main
    short: Type denotations used as equality RHSs are $\approx$-closed.
    statement: Type denotations used as equality RHSs are $\approx$-closed
    anchor: \texttt{evalVarEquality}
    anchor_files: [src/TypeCheckRefine.sk]
    status: [violated]
    status_note: >-
      \textsc{violated}, witnessed end-to-end at the undefined/\texttt{void}
      corner (\S\ref{sec:ex-voidseq}; issue draft
      \texttt{void-undefined-equality-never.md}): \texttt{evalVarEquality}'s
      generic variable-RHS arm installs
      $\mathtt{inter}(\texttt{void},\texttt{undefined}) = \texttt{never}$
      while $\approx$ relates the two units, and the \texttt{void}-operand
      check on \texttt{===} is a warning, so the corner is reachable — the
      branch runs with \texttt{undefined} bound at \texttt{never}. The
      undefined-\emph{literal} arm filters the units jointly and is sound;
      literal/full primitives and objects remain $\approx$-closed by
      construction
    summary:
      - {bucket: violated-witnessed,
         label: "\\texttt{undefined}/\\texttt{void} equality can narrow a live value to \\texttt{never} (L-SEQ)"}
    owner: main
    consumers: []
    issues: [void-undefined-equality-never.md]

  - id: L-ASSERT
    kind: assumption
    table: main
    short: >-
      \texttt{console.assert}$(e)$ establishes $e$ on the subsequent
      path.
    statement: >-
      The premise behind the \texttt{console.assert} refinement clause:
      the call must not return normally when $e$ is false, and the callee
      must resolve to the global assertion function — neither condition holds
    anchor: \texttt{TypeCheckExpr.sk} (the \texttt{console.assert} match)
    anchor_files: [src/TypeCheckExpr.sk]
    status: [violated]
    status_note: >-
      \textsc{violated}, witnessed end-to-end in both directions (issue
      draft \texttt{console-assert-narrowing.md}): a failed
      \texttt{console.assert} logs and continues, so the narrowed path
      runs with the condition false; and the match is by spelling alone,
      so a shadowing binding named \texttt{console} with an arbitrary
      \texttt{assert} method triggers the same refinement. tsc rejects
      both witnesses. Fix shape: remove the refinement or register a
      recognized assertion function that does not return when its condition
      is false
    summary:
      - {bucket: violated-witnessed,
         label: "\\texttt{console.assert} narrows even when a false condition can return normally or the receiver is shadowed (L-ASSERT)"}
    owner: main
    consumers: []
    issues: [console-assert-narrowing.md]


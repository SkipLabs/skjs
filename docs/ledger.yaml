    summary: [{bucket: proved, label: "L-ISARR"}]
    owner: A
    consumers: []
    issues: []

  - id: L-LOCAL
    kind: assumption
    table: main
    short: >-
      Module-level bindings are never narrowed; function-level locals are,
      including captured ones.
    statement: >-
      Module-level bindings are never narrowed (they resolve through
      \texttt{defMap}, not the scope chain, so the primitive's early return
      fires). Function-level locals \emph{are} narrowed — including locals
      of enclosing functions reached from inside a closure, since scope
      lookup walks the whole chain
    anchor: \texttt{setLocalFilterMap}; \texttt{TypeCheckScope.sk}
    anchor_files: [src/TypeCheckRefine.sk, src/TypeCheckScope.sk]
    status: [proved]
    status_note: >-
      \textsc{proved} (by code inspection) for the module-level half; the
      captured-local half sharpens L-PURE; a pinned test is recommended.
      Narrowing module-level bindings is a tracked future enhancement
      (issue \#585, blocked on immutability)
    summary: []
    owner: F
    consumers: []
    issues: []

  - id: L-PURE
    kind: assumption
    table: main
    short: Evaluating a condition does not mutate the narrowed locals.
    statement: Evaluating a condition does not mutate the narrowed locals
    anchor: "—"
    anchor_files: []
    status: [violated]
    status_note: >-
      \textsc{violated} (empirically pinned): the checker narrows across a
      call that assigns a captured local and accepts the resulting unsound
      program (\texttt{if (x !== null \&\& mut())} with \texttt{mut}
      setting \texttt{x = null}) — the same unsoundness tsc accepts.
      Tracked as issues \#597 (side-effecting call between test and use)
      and \#599 (captured local mutated via a lambda). The one-step scoping
      of the branch-soundness theorems (\S\ref{sec:scope}) is therefore a
      real boundary, not caution. Deep dive F specifies the fix: a layered
      invalidation policy (P1--P4) with a preservation lemma replacing the
      one-step scoping
    summary:
      - {bucket: violated-witnessed,
         label: "L-PURE (\\#597/\\#599) with the L-MUT instance \\#598"}
    owner: F
    consumers: [A]
    issues: []

  - id: L-CAPT
    kind: assumption
    table: main
    short: >-
      Assignments to captured locals are checked against the binding's
      declared type.
    statement: >-
      Assignments to captured locals are checked against the binding's
      declared type (an implicit premise of L-TC for closure bodies)
    anchor: \texttt{Scope::set}; \texttt{TypeCheckExpr.sk} (lambda checking)
    anchor_files: [src/TypeCheckScope.sk, src/TypeCheckExpr.sk]
    status: [proved]
    status_note: >-
      \textsc{proved} (deep dive F) for annotated and initializer-inferred
      bindings: assignments to captured locals are routed through the
      binding's write path and checked against the declared or widened
      inferred type, in lambda bodies as at top level. Carve-out: bindings
      declared bare (\texttt{let x = null/undefined}) evolve and their
      captured writes are unchecked — tsc-parity by design. The read-side
      staleness of enclosing narrowings is the separate row L-STALE-READ
    summary:
      - {bucket: proved, label: "L-CAPT"}
    owner: F
    consumers: []
    issues: []

  - id: L-STALE-READ
    kind: series-obligation
    table: main
    short: >-
      A closure body invoked later reads enclosing narrowings that are
      stale at invocation time.
    statement: >-
      Closure bodies capture enclosing narrowings, but invocation may
      postdate mutations that invalidate them — the read-in dual of the
      L-PURE family (\#599)
    anchor: \texttt{TypeCheckExpr.sk} (lambda checking); narrowed-scope capture
    anchor_files: [src/TypeCheckExpr.sk]
    status: [violated]
    status_note: >-
      \textsc{violated}, witnessed end-to-end in both forms — a captured
      narrowed local and a narrowed field read inside a closure (deep
      dive F; issue draft \texttt{stale-closure-reads-narrowing.md});
      the fix shape is deep dive F's layered invalidation policy, shared
      with L-PURE
    summary:
      - {bucket: violated-witnessed,
         label: "stale closure reads of enclosing narrowings (L-STALE-READ)"}
    owner: F
    consumers: []
    issues: [stale-closure-reads-narrowing.md]

  - id: L-LOOP-CARRIED
    kind: series-obligation
    table: main
    short: >-
      A pre-loop narrowing of an annotated binding survives a back-edge
      write that invalidates it.
    statement: >-
      Loop-carried narrowing staleness: \texttt{Scope::set}'s annotation
      arm checks a back-edge write only against the declared type, so a
      pre-loop narrowing of an annotated binding survives into iteration
      2 after a write that falsifies it; un-annotated bindings are
      protected by the through-loop check
    anchor: \texttt{Scope::set} (annotation arm); loop merge
    anchor_files: [src/TypeCheckScope.sk]
    status: [violated]
    status_note: >-
      \textsc{violated}, witnessed end-to-end (deep dive F; issue draft
      \texttt{loop-carried-narrowing-stale.md}): the narrowed read binds
      \texttt{null} at \texttt{string} on iteration 2; tsc rejects. Fix
      shape: deep dive F's P1 loop-entry invalidation layer
    summary:
      - {bucket: violated-witnessed,
         label: "loop-carried narrowing staleness (L-LOOP-CARRIED)"}
    owner: F
    consumers: []
    issues: [loop-carried-narrowing-stale.md]

  - id: L-CLONE
    kind: assumption
    table: main
    short: >-
      A type computed by \texttt{inter} under a cloned substitution

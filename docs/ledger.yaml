      (intersected named-field $\mathsf{set}$-types, else the covering
      index's, resolved as at lvalue sites); readonly
      ($\mathsf{set}=\bot$) and keys with no writable field or index
      authorize nothing; call-mediated writes are E-SIG's
    anchor: \texttt{TFields::resolveFieldType} (\texttt{isLValue})

  - id: L-LIT
    kind: assumption
    table: main
    short: >-
      Literal spellings: (i) $\delta$ is a function; (ii) injectivity
      modulo $\approx$ after normalization; (iii) falsiness-exactness of
      the lexeme test.
    statement: >-
      Three claims about literal spellings: (i) $\delta$ is a function —
      definitional, used by R2; (ii) \emph{injectivity modulo $\approx$}
      after normalization — needed only for \emph{exactness} claims; (iii)
      \emph{falsiness-exactness}: the lexeme test \texttt{isFalsy} agrees
      with Definition~\ref{def:truthiness} — needed by the residue lemma
    anchor: \texttt{PrimLiterals.sk}; \texttt{isZeroSpelling}
    anchor_files: [src/PrimLiterals.sk, src/TType.sk]
    status: [violated]
    status_note: >-
      (i) \textsc{proved} (definitional); (ii)/(iii) \textsc{violated} by
      \#655: \texttt{isZeroSpelling} covers exactly 14 spellings (signed
      decimal/hex/binary/octal zero), missing \texttt{0.0}, \texttt{0e0},
      \texttt{00}, \texttt{0\_0}, bigint analogues, and non-\texttt{NaN}
      spellings. Conditional on (ii): the exactness clause of
      Theorem~\ref{thm:rmc} (precision only); on (iii): the
      literal-filtering case of Lemma~\ref{lem:residue-sound} — with an
      \emph{observable unsoundness witness} (\S\ref{sec:ex-655}, pinned).
      Claim (ii) is additionally \textsc{violated} for the \emph{string}
      kind: escape sequences are stored undecoded, witnessed end-to-end
      (deep dive G; issue draft
      \texttt{string-literal-escapes-undecoded.md} — outside \#655's
      numeric/bigint scope). Claim (iii) is \emph{also} \textsc{violated}
      for the string kind: a line-continuation lexeme denotes \texttt{""}
      but is classified truthy (witnessed end-to-end; same issue draft).
      All other results are unconditional
    summary:
      - {bucket: violated-witnessed,
         label: "L-LIT(ii)/(iii) (\\#655 and the string escapes)"}
    owner: G
    consumers: [B, D]
    issues: [string-literal-escapes-undecoded.md]


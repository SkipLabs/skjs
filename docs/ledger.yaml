      $f_2.\mathsf{set} \leq f_1.\mathsf{set}$ (contravariant) and the
      readonly gate, so under SET-SEM an admitted view authorizes only
      writes the source view authorizes
    anchor: \texttt{TFields::isSub\_}
    anchor_files: [src/TTypeSubtyping.sk]

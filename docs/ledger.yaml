    anchor: \texttt{TTypeInter.sk}
    anchor_files: [src/TTypeInter.sk]
    status: [violated]
    status_note: >-
      \textsc{violated} (deep dive B) in three strata: the
      \texttt{TFun::inter} stratum — incomparable signatures treated as
      disjoint (issue draft
      \texttt{tfun-inter-incomparable-not-disjoint.md}); the string-kind
      literal-spelling stratum (undecoded escapes, mediated by L-LIT); and
      the num-kind beyond-precision spelling stratum — distinct spellings
      of one double kept distinct, their lexeme intersection a spurious
      $\bot$ (mediated by L-LIT; issue draft
      \texttt{beyond-precision-numeric-literals.md}). The per-tag
      \texttt{STypes} assembly and within-precision numeric spellings
      produce only semantic bottoms and are \textsc{proved}
    summary:

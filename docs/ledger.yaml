    anchor: \texttt{TType::expand}
    anchor_files: [src/TType.sk]
    status: [proved]
    status_note: >-
      \textsc{proved} (deep dive C) for the modes refinement uses
      (\texttt{None}/Covariant) — and shown \emph{false} in contravariant
      mode (unbound reads produce $\bot$), so the axiom is hereby scoped to
      those modes; all refinement clients verified to use only them.
      The containment proof consumes both L-INTER cases and is therefore
      conditional on L-INTER-BOT (\textsc{violated}) as well as on
      L-INTER's open cache-reuse case.
      Reusing an alias expansion is exact because alias normalization does
      not read existing variable bindings. The remaining conditions are
      recorded separately as E-NORM, E-ARR, E-CLASS-SYM, E-GUARD, E-EXPKEY,
      and E-PLACEHOLDER-ATOM; see deep dive C
    summary: [{bucket: proved, label: "L-EXP (mode-scoped; conditional on L-INTER/L-INTER-BOT and its named expansion obligations)"}]
    owner: C
    consumers: [B, D, F]
    issues: []

  - id: L-MONO
    kind: assumption
    table: main
    short: >-
      Legal inference-state changes during refinement preserve membership in
      types computed earlier.
    statement: >-
      Legal inference-state changes during refinement preserve membership in
      types computed earlier (Axiom~\ref{ax:mono})
    anchor: \texttt{Subst::get}, refinement sites
    anchor_files: [src/TTypeSubst.sk, src/TypeCheckRefine.sk]
    status: [proved]
    status_note: >-
      \textsc{proved} (deep dive E, given M1 — semantic monotonicity in
      variable envelopes — and L-UNION); \texttt{setConstraint} is a
      functional update, so there is no shared-state threat, and the
      $\mathrm{range}(\Env)$ restriction is droppable (see the axiom's

# The soundness ledger: single source of truth for the status of every
# assumption and proof obligation of docs/skjs-type-soundness.tex and its
# deep-dive series. All documents render or cite this file; do not state
# an item's status anywhere else.
#
# Fields per entry:
#   id           stable name, cited as-is from all documents
#   kind         assumption | obligation | series-assumption | series-obligation
#   table        main | series   (which generated table renders it)
#   short        one-line plain-LaTeX statement (no \ref; safe in any doc)
#   statement    LaTeX for the main table's Statement cell (may use main-paper \ref)
#   anchor       LaTeX for the main table's Anchor cell
#   anchor_files repo paths the checker verifies exist (prefix src/ only)
#   status       machine list, subset of [proved, assumed, open, violated]
#   status_note  LaTeX for the main table's Status cell (may use main-paper \ref)
#   summary      list of {bucket, label} rendered into the generated summary;
#                buckets: proved | assumed | open | violated-witnessed | violated-derived
#   owner        the single paper owning this row's proof/refutation
#                (A..G, or main for axioms stated by the main paper)
#   consumers    deep dives whose results depend on this row (the
#                cross-paper dependency graph; the main paper consumes
#                every row by design and is not listed)
#   issues       files under deep-dives/issues/ (witnesses), if any
#
# Pinned revision: see docs/shared/pin.tex.

papers:
  - letter: A
    file: runtime-grounding.tex
    title: "Runtime Grounding: ECMAScript Semantics for the SKJS Value Domain"
    scope: >-
      Grounds the value domain and runtime predicates (tags, strict
      equality, truthiness, callable/constructible, IsArray, instanceof)
      in ECMAScript.
  - letter: B
    file: lattice-operations.tex
    title: "Union and Intersection Soundness"
    scope: >-
      Stratum-by-stratum audit of union and intersection, including the
      load-bearing bottom-implies-disjointness clause.
  - letter: C
    file: type-expansion.tex
    title: "Type Expansion"
    scope: >-
      Expansion modeled and proved mode-scoped; the expansion cache shown
      exact via binding-blind normalization.
  - letter: D
    file: subtyping-validation.tex
    title: "Subtyping Validation Soundness"
    scope: >-
      The isSub architecture, its caches and coinduction, and per-stratum
      validation soundness.
  - letter: E
    file: subst-state-discipline.tex
    title: "The Substitution State Machine"
    scope: >-
      Monotonicity, monotone reads, clone stability, and rollback of the
      inference substitution.
  - letter: F
    file: refinement-invalidation.tex
    title: "Refinement Invalidation under Mutation"
    scope: >-
      Mutation versus narrowing: the layered invalidation policy, field
      re-widening, and the captured-write hole.
  - letter: G
    file: literal-canonicalization.tex
    title: "Literal Canonicalization"
    scope: >-
      Canonical literal forms: injectivity and falsiness-exactness of the
      lexeme tests over the parser's canonical literals.
  - letter: H
    file: view-coherence.tex
    title: "View Coherence: the Write Surface of Installed Types"
    scope: >-
      The write-authorization surface of every view the checker admits or
      installs — subtyping-admitted, narrowing-admitted, and minted views —
      audited for cross-view coherence (L-MUT-ALIAS).


    summary: [{bucket: proved, label: "L-CLONE"}]
    owner: E
    consumers: []
    issues: []

  - id: L-MUT
    kind: assumption
    table: main
    short: >-
      Field writes are governed by $\mathsf{set}$-types; get-only
      membership is sound for snapshot reads.
    statement: >-
      Field writes are governed by $\mathsf{set}$-types via subtyping;
      membership semantics (get-only) is sound for the snapshot reads
      refinement performs
    anchor: \texttt{TField}
    anchor_files: [src/TType.sk]
    status: [assumed]
    status_note: >-
      \textsc{assumed}; full mutation model out of scope. The tracked

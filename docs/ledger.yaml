  - id: L-LOCAL
    kind: assumption
    table: main
    short: >-
      Module-level bindings are never narrowed; function-level locals are,
      including captured ones.
    statement: >-
      Module-level bindings are never narrowed (they resolve through
      \texttt{defMap}, not the scope chain, so the primitive's early return
      fires). Function-level locals \emph{are} narrowed — including locals
      of enclosing functions reached from inside a closure, since scope
      lookup walks the whole chain
    anchor: \texttt{setLocalFilterMap}; \texttt{TypeCheckScope.sk}
    anchor_files: [src/TypeCheckRefine.sk, src/TypeCheckScope.sk]
    status: [proved]
    status_note: >-
      \textsc{proved} (by code inspection) for the module-level half; the
      captured-local half sharpens L-PURE; a pinned test is recommended.
      Narrowing module-level bindings is a tracked future enhancement
      (issue \#585, blocked on immutability)
    summary: []
    owner: F
    consumers: []
    issues: []

  - id: L-PURE
    kind: assumption
    table: main
    short: Evaluating a condition does not mutate the narrowed locals.
    statement: Evaluating a condition does not mutate the narrowed locals
    anchor: "—"
    anchor_files: []
    status: [violated]
    status_note: >-
      \textsc{violated} (empirically pinned): the checker narrows across a
      call that assigns a captured local and accepts the resulting unsound
      program (\texttt{if (x !== null \&\& mut())} with \texttt{mut}
      setting \texttt{x = null}) — the same unsoundness tsc accepts.
      Tracked as issues \#597 (side-effecting call between test and use)
      and \#599 (captured local mutated via a lambda). The one-step scoping
      of the branch-soundness theorems (\S\ref{sec:scope}) is therefore a
      real boundary, not caution. Deep dive F specifies the fix: a layered
      invalidation policy (P1--P4) with a preservation lemma replacing the
      one-step scoping
    summary:
      - {bucket: violated-witnessed,
         label: "L-PURE (\\#597/\\#599) with the L-MUT instance \\#598"}
    owner: F
    consumers: [A]
    issues: []


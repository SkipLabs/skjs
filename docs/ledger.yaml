    issues: []

  - id: L-LOCAL
    kind: assumption
    table: main
    short: >-
      Module-level bindings are never narrowed; function-level locals are,
      including captured ones.
    statement: >-
      Module-level bindings are never narrowed (they resolve through
      \texttt{defMap}, not the scope chain, so the primitive's early return
      fires). Function-level locals \emph{are} narrowed — including locals
      of enclosing functions reached from inside a closure, since scope
      lookup walks the whole chain
    anchor: \texttt{setLocalFilterMap}; \texttt{TypeCheckScope.sk}
    anchor_files: [src/TypeCheckRefine.sk, src/TypeCheckScope.sk]
    status: [proved]
    status_note: >-
      \textsc{proved} (by code inspection) for the module-level half; the
      captured-local half sharpens L-PURE; a pinned test is recommended.
      Narrowing module-level bindings is a tracked future enhancement
      (issue \#585, blocked on immutability)
    summary: []
    owner: F
    consumers: []
    issues: []

  - id: L-PURE
    kind: assumption
    table: main
    short: Evaluating a condition does not mutate the narrowed locals.
    statement: Evaluating a condition does not mutate the narrowed locals
    anchor: "—"
    anchor_files: []
    status: [violated]
    status_note: >-
      \textsc{violated} (empirically pinned): the checker narrows across a
      call that assigns a captured local and accepts the resulting unsound
      program (\texttt{if (x !== null \&\& mut())} with \texttt{mut}
      setting \texttt{x = null}) — the same unsoundness tsc accepts.
      Tracked as issues \#597 (side-effecting call between test and use)
      and \#599 (captured local mutated via a lambda). The one-step scoping
      of the branch-soundness theorems (\S\ref{sec:scope}) is therefore a
      real boundary, not caution. Deep dive F specifies the fix: a layered
      invalidation policy (P1--P4) with a preservation lemma replacing the
      one-step scoping
    summary:
      - {bucket: violated-witnessed,
         label: "mutation can invalidate a narrowing during condition evaluation or inside a refined branch (L-PURE/L-MUT; \\#597--\\#599)"}
    owner: F
    consumers: [A]
    issues: []

  - id: L-CAPT
    kind: assumption
    table: main
    short: >-
      Assignments to captured annotated or initializer-inferred locals
      are checked against the binding's declared or widened inferred
      type.
    statement: >-
      Assignments to captured annotated or initializer-inferred locals
      are checked against the binding's declared or widened inferred type
      (an implicit premise of L-TC for closure bodies); evolving bindings
      are the separate row L-CAPT-EVOLVE
    anchor: \texttt{Scope::set}; \texttt{TypeCheckExpr.sk} (lambda checking)
    anchor_files: [src/TypeCheckScope.sk, src/TypeCheckExpr.sk]
    status: [proved]
    status_note: >-
      \textsc{proved} (deep dive F): assignments to captured annotated or
      initializer-inferred locals are routed through the binding's write
      path and checked against the declared or widened inferred type, in
      lambda bodies as at top level. The evolving-binding exemption is
      the separate violated row L-CAPT-EVOLVE; the read-side staleness of
      enclosing narrowings is the separate row L-STALE-READ
    summary:
      - {bucket: proved, label: "L-CAPT (annotated and initializer-inferred bindings)"}
    owner: F
    consumers: []
    issues: []

  - id: L-CAPT-EVOLVE
    kind: assumption
    table: main
    short: >-
      A captured write to an evolving binding (bare
      \texttt{let x = null/undefined}) is unchecked, and later reads
      keep the stale evolved type.
    statement: >-
      Evolving bindings are exempt from the captured-write check, and
      reads after the closure runs do not incorporate the written value
      — the part of the captured-write question that L-CAPT's proved
      statement excludes
    anchor: \texttt{Scope::set} (evolving exemption); \texttt{getSingleVar}
    anchor_files: [src/TypeCheckScope.sk]
    status: [violated]
    status_note: >-
      \textsc{violated}, witnessed end-to-end (deep dive F; issue draft
      \texttt{evolving-capture-unchecked.md}): a closure writes
      \texttt{"s"} into a bare \texttt{let x = null} binding and a later
      read binds the string at type \texttt{null}; tsc accepts the same
      program (evolving \texttt{any} parity). Fix shape: track captured
      writes in the evolved union or check them against it at the write
      site
    summary:
      - {bucket: violated-witnessed,
         label: "unchecked captured writes to evolving bindings (L-CAPT-EVOLVE)"}
    owner: F
    consumers: []

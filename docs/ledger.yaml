  - id: A-CTOR-CALL
    kind: assumption
    table: main
    short: >-
      Class-constructor values carry $\mathsf{CPresent}$ construct and
      $\mathsf{CFunction}$ call modes, consistent with
      $[[\mathrm{Call}]]$/$[[\mathrm{Construct}]]$.
    statement: >-
      Class-constructor values are typed with construct mode
      $\mathsf{CPresent}$ and call mode $\mathsf{CFunction}$ (Definition
      Callability), so \texttt{typeof}-\texttt{"function"} refinement
      keeps them — the runtime facts $[[\mathrm{Call}]]$ and
      $[[\mathrm{Construct}]]$ are both represented
    anchor: \texttt{newStaticObject}; \texttt{narrowByTypeofFunction}
    anchor_files: [src/TEnv.sk, src/TType.sk]
    status: [proved]
    status_note: >-
      \textsc{proved} (deep dive A: constructor values built with both
      positive modes, and the constructible-implies-$[[\mathrm{Call}]]$
      invariant enforced at \texttt{TFields} construction); the residual
      brand-trust gap of the \texttt{Callability} lattice is the separate
      row F-CABSENT
    summary: [{bucket: proved, label: "A-CTOR-CALL"}]
    owner: A
    consumers: [D]
    issues: []

  - id: L-TC
    kind: assumption
    table: main
    short: Checked expressions inhabit their checked types.
    statement: >-
      Checked expressions inhabit their checked types (used for the RHS of
      \textsc{R-Eq} and field reads)
    anchor: \texttt{TypeCheckExpr.sk}
    anchor_files: [src/TypeCheckExpr.sk]
    status: [assumed]
    status_note: >-
      \textsc{assumed} (axiom here; a full development would discharge it
      by mutual induction with a preservation theorem, of which the
      branch-soundness lemmas are the condition case)
    summary: [{bucket: assumed, label: "L-TC (the capstone)"}]
    owner: main
    consumers: [A, F]
    issues: []

  - id: L-LIT
    kind: assumption
    table: main
    short: >-
      Literal spellings: (i) $\delta$ is a function; (ii) injectivity
      modulo $\approx$ after normalization; (iii) falsiness-exactness of
      the lexeme test.
    statement: >-
      Three claims about literal spellings: (i) $\delta$ is a function —
      definitional, used by R2; (ii) \emph{injectivity modulo $\approx$}
      after normalization — needed only for \emph{exactness} claims; (iii)
      \emph{falsiness-exactness}: the lexeme test \texttt{isFalsy} agrees
      with Definition~\ref{def:truthiness} — needed by the residue lemma
    anchor: \texttt{normalizeJSNumber}/\texttt{normalizeJSBigInt}; \texttt{isFalsy}; string-escape decoding; enum fold outputs
    anchor_files: [src/JSNumericString.sk, src/ParserUtils.sk, src/TType.sk, src/PrimLiterals.sk, src/JSStringEscape.sk, src/TypeCheckEnum.sk]
    status: [violated]
    status_note: >-
      (i) \textsc{proved} (definitional). For the \emph{string} kind,
      (ii)/(iii) are \textsc{proved}: escape sequences are decoded at
      parse time (\texttt{JSStringEscape.sk}), so a literal's stored
      lexeme is its denoted string — one spelling per value (ii) and the
      lexeme emptiness test agrees with falsiness (iii). For num/bigint,
      (ii)/(iii) are \textsc{proved} for \emph{within-precision} literals:
      normalized to canonical form at parse time
      (\texttt{normalizeJSNumber}/\texttt{normalizeJSBigInt}), so on that
      range zero has one spelling per kind and injectivity holds. For
      \emph{beyond-precision} numeric literals — those failing the
      round-trip $\mathtt{String(Number(s))} = s$: 16--17-digit decimals,
      radix forms $> 2^{53}$, over/underflow exponent forms — (ii)/(iii)
      are \textsc{violated}: distinct spellings of one double are kept
      distinct, so \texttt{===} narrowing yields a spurious \texttt{never}
      (ii), and the normalizer can emit a zero-denoting lexeme
      (\texttt{1e-400}, underflow to $+0$) classified truthy (iii) — both
      witnessed end-to-end (issue draft
      \texttt{beyond-precision-numeric-literals.md}). All three claims
      quantify over \emph{all stored literals}, enum-folder-synthesized
      ones included (deep dive G proves the fold outputs canonical in
      form); whether a synthesized literal equals the runtime value of
      its source expression is the orthogonal row L-LIT-FOLD. All
      other results are unconditional
    summary:
      - {bucket: violated-witnessed,
         label: "L-LIT(ii)/(iii) num beyond-precision spellings"}
    owner: G
    consumers: [B, D]
    issues: [beyond-precision-numeric-literals.md]

  - id: L-LIT-FOLD
    kind: series-obligation
    table: series
    short: >-
      A literal synthesized by the enum constant folder denotes the
      member's runtime value.
    statement: ""
    anchor: \texttt{enumFold} (string-concat arms); \texttt{enumNumOrUnknown}
    anchor_files: [src/TypeCheckEnum.sk]
    status: [violated]
    status_note: >-
      \textsc{violated}, witnessed end-to-end (deep dive G; issue draft
      \texttt{enum-concat-imprecise-fold.md}): the string-concat arms
      concatenate operand \emph{lexemes}, and a direct numeric-literal
      operand bypasses the double-safe gate that guards numeric fold
      results, so a beyond-precision spelling mints a member literal
      whose spelling is not the runtime string
      (\texttt{"x" + 1e-400} folds to \texttt{"x1e-400"}; the runtime
      value is \texttt{"x0"}). Numeric folds are exact within the gate
      and mint no literal outside it — that half is \textsc{proved}.
      A prerequisite of the future preservation theorem's switch-coverage
      lemma (semantic case coverage consumes member-value faithfulness)
    summary:
      - {bucket: violated-witnessed,
         label: "the enum folder's concat-minted literals (L-LIT-FOLD)"}
    owner: G
    consumers: []
    issues: [enum-concat-imprecise-fold.md]

  - id: L-INST
    kind: assumption
    table: main
    short: >-
      $P_{\mathsf{inst}}(C) \subseteq \sem{T_C}$ for the instance type as
      instantiated at the narrowing site.
    statement: >-
      $P_{\mathsf{inst}}(C) \subseteq \sem{T_C}$ for the instance type as
      instantiated at the narrowing site
    anchor: \texttt{evalInstanceof}
    anchor_files: [src/TypeCheckRefine.sk]
    status: [proved]
    status_note: >-
      \textsc{proved} (deep dive A) modulo A-HASINST and A-PROTO (both
      \textsc{assumed}): narrowing preserves the scrutinee's own type
      arguments — the instance view is built as \texttt{TFields} from the
      resolved class with the preservation probe run per branch — so the
      installed type is inhabited by exactly the values \texttt{instanceof}
      admits at those arguments; no fresh unbound candidates are minted at
      the narrowing site
    summary:
      - {bucket: proved, label: "L-INST (modulo A-HASINST, A-PROTO)"}
    owner: A
    consumers: [H]
    issues: []

  - id: L-ISARR
    kind: assumption
    table: main
    short: >-
      $\mathsf{isArrayV}(o)$ implies
      $o \in \sem{\mathsf{ReadonlyArray}\langle\top\rangle}$.
    statement: >-
      $\mathsf{isArrayV}(o)$ implies
      $o \in \sem{\mathsf{ReadonlyArray}\langle\top\rangle}$
    anchor: \texttt{evalIsArray}
    anchor_files: [src/TypeCheckRefine.sk]

  - id: L-INTER
    kind: assumption
    table: main
    short: >-
      When \texttt{inter} returns a non-$\bot$ result, that result contains
      the semantic intersection of its operands, provided every recursive
      call that returned $\bot$ had disjoint operands (L-INTER-BOT).
    statement: >-
      Non-bottom containment: when $\mathtt{inter}(t_1,t_2) \neq \bot$,
      $\sem{t_1} \cap \sem{t_2} \subseteq \sem{\mathtt{inter}(t_1,t_2)}$,
      conditional on L-INTER-BOT for recursive intersections used to build
      the result. The top-level $\bot$ case is also L-INTER-BOT; a consumer that
      concludes an inhabitant is \emph{in} the implemented intersection
      needs both rows, since a $\bot$ result empties the conclusion
    anchor: \texttt{TTypeInter.sk}
    anchor_files: [src/TTypeInter.sk]
    status: [open]
    status_note: >-
      \textsc{proved} (deep dive B) for every fresh structural
      intersection that returns non-$\bot$, conditional on L-INTER-BOT for
      recursive calls and using the canonical TVAR-SEM definition for the
      instance layer; \textsc{open} for stale \texttt{seenInter} reuse under
      inference growth (C-FREEZE-CACHE)
    summary:
      - {bucket: proved, label: "fresh non-bottom intersections contain the semantic intersection, provided recursive bottom results are sound (L-INTER)"}
      - {bucket: open, label: "non-bottom containment after stale seenInter cache reuse (L-INTER; C-FREEZE-CACHE)"}
    owner: B
    consumers: [C, D, F, E, A]
    issues: []

  - id: L-INTER-BOT
    kind: assumption
    table: main
    short: >-
      A $\bot$ result from \texttt{inter} implies semantic disjointness.
    statement: >-
      A $\bot$ result from \texttt{inter} implies semantic disjointness —
      the property required by refinement rules that discard an impossible
      branch and by L-SUB's covariant variable read (O-GETCOV)
    anchor: \texttt{TTypeInter.sk}
    anchor_files: [src/TTypeInter.sk]
    status: [violated]
    status_note: >-
      \textsc{violated} (deep dive B) in two cases: the
      \texttt{TFun::inter} case — incomparable signatures treated as
      disjoint (issue draft
      \texttt{tfun-inter-incomparable-not-disjoint.md}); and the num-kind
      beyond-precision spelling case — distinct spellings of one
      double kept distinct, their lexeme intersection a spurious $\bot$
      (mediated by L-LIT; issue draft
      \texttt{beyond-precision-numeric-literals.md}). The per-tag
      \texttt{STypes} assembly, within-precision numeric spellings, and
      decoded string spellings produce only semantic bottoms and are
      \textsc{proved}; stale \texttt{seenInter} reuse under inference
      growth remains the separate open cache obligation C-FREEZE-CACHE
    summary:
      - {bucket: violated-witnessed,
         label: "intersection returns $\\bot$ for overlapping functions or numeric spellings (L-INTER-BOT)"}
    owner: B
    consumers: [C, D, F, E, A]
    issues: [tfun-inter-incomparable-not-disjoint.md,
             beyond-precision-numeric-literals.md]

  - id: L-EXP
    kind: assumption
    table: main
    short: >-
      Expansion preserves or enlarges semantics (modes
      \texttt{None}/Covariant); residual instances keep theirs.
    statement: >-
      Expansion preserves or enlarges semantics; residual instances keep

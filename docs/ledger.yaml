      every field arm (deep dive D, write-direction lemma); the SET-SEM
      containment they induce is conditional on the recursive
      \texttt{isSub} verdicts, exactly as the read direction is inside
      L-SUB
    summary: []
    owner: D
    consumers: [H]
    issues: []

  - id: L-SUB-CLOSED-ABSENCE
    kind: series-lemma
    table: series
    short: >-
      \texttt{isSub} admission cannot manufacture a \texttt{Closed<T>}
      absence fact: acceptance requires the source to prove
      $\mathsf{get}=\bot$ at every key the target proves absent.
    statement: >-
      Absence-fact preservation: against a closed target's never-valued
      index, a source with no covering index is rejected
      ($\top \leq \bot$), a source with one is accepted only if its
      $\mathsf{get} \leq \bot$, and a source \emph{naming} an extra field
      the target proves absent is rejected by the width lemma's
      extra-field check against the never-valued index — so an admitted
      view proves absent only keys the source already proved absent; the
      fact \textsc{R-In}'s true-branch pruning consumes
    anchor: \texttt{TFields::isSub\_IndexPair}; \texttt{TFields::isSub\_NamedFields} (extra-field arm); \texttt{closeObjectType}
    anchor_files: [src/TTypeSubtyping.sk, src/TEnv.sk]
    status: [open]
    status_note: >-
      \textsc{open} (conditional): the syntactic checks are verified at
      every index-pair arm and at \texttt{isSub\_NamedFields}'s
      extra-source-field-against-target-index arm (deep dive D, the
      absence corollary); the containment they induce is conditional on
      the recursive \texttt{isSub} verdicts, exactly as the read
      direction is inside L-SUB
    summary: []
    owner: D
    consumers: [H]
    issues: []


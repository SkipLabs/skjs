  - id: SET-SEM
    kind: series-lemma
    table: series
    short: >-
      A view authorizes exactly the writes its resolved
      $\mathsf{set}$-types accept; a readonly field authorizes nothing.
    statement: >-
      Write authorization: a view authorizes the write of $v$ at key $p$
      iff $v$ inhabits the resolved $\mathsf{set}$-type of $p$
      (intersected named-field $\mathsf{set}$-types, else the covering
      index's); readonly ($\mathsf{set}=\bot$) authorizes nothing;
      call-mediated writes are E-SIG's
    anchor: \texttt{TFields::resolveFieldType} (\texttt{isLValue})
    anchor_files: [src/TType.sk]
    status: [proved]
    status_note: >-
      \textsc{proved} by definition in the main paper and matched to the
      checker's write path: assignment checks the right-hand side against
      the resolved $\mathsf{set}$-type by subtyping
    summary: [{bucket: proved, label: "SET-SEM"}]
    owner: main
    consumers: [H]
    issues: []


name = "verification"
defaultTargets = ["verifier", "Verification", "cell_claim_tests"]

[[lean_lib]]
name = "Verification"
globs = [
  "Verification.Model.Semantics.+",
  "Verification.Model.Types.+",
  "Verification.Model.Programs.+",
  "Verification.Model.Source.+",
  "Verification.Model.Tests.+",
]

[[lean_exe]]
name = "verifier"

<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="470" viewBox="0 0 1220 470" role="img" aria-labelledby="title desc">
<title id="title">Verification pipeline</title>
<desc id="desc">An independently parsed TypeScript source and SKJS's exported claims are lowered into a verification request. An untrusted producer searches for evidence; the proved verifier checks the evidence against the exact request and reports a verdict.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
  </marker>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 17px; }
  .h { font-weight: 650; }
  .s { font-size: 14px; fill: #57606a; }
  .lbl { font-size: 14px; fill: #57606a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .e { fill: none; stroke: #57606a; stroke-width: 2; marker-end: url(#arrow); }
  .input { fill: #f6f8fa; stroke: #8c959f; }
  .reviewed { fill: #fff8e5; stroke: #d4a72c; }
  .untrusted { fill: #eef3ff; stroke: #6e8fd6; }
  .proved { fill: #eaf7ee; stroke: #3fa35b; }
  .data { fill: #ffffff; stroke: #8c959f; stroke-dasharray: 5 4; }
</style>
<rect width="1220" height="470" fill="#ffffff"/>

<!-- inputs -->
<rect class="input" x="30" y="60" width="200" height="64" rx="10" stroke-width="1.5"/>
<text x="130" y="88" text-anchor="middle" class="h">TypeScript source</text>
<text x="130" y="110" text-anchor="middle" class="s">one function at a time</text>

<rect class="input" x="30" y="220" width="200" height="64" rx="10" stroke-width="1.5"/>
<text x="130" y="248" text-anchor="middle" class="h">SKJS</text>
<text x="130" y="270" text-anchor="middle" class="s">the checker under audit</text>

<!-- stage 1 -->
<rect class="reviewed" x="300" y="60" width="200" height="64" rx="10" stroke-width="1.5"/>
<text x="400" y="88" text-anchor="middle" class="h">Parser</text>
<text x="400" y="110" text-anchor="middle" class="lbl">fragment-parse.js</text>

<rect class="data" x="300" y="220" width="200" height="64" rx="10" stroke-width="1.5"/>
<text x="400" y="248" text-anchor="middle" class="h">Claims</text>
<text x="400" y="270" text-anchor="middle" class="s">types and environments</text>

<!-- stage 2 -->
<rect class="reviewed" x="570" y="140" width="210" height="64" rx="10" stroke-width="1.5"/>
<text x="675" y="168" text-anchor="middle" class="h">Source extraction</text>
<text x="675" y="190" text-anchor="middle" class="lbl">SourceExtraction.lean</text>

<rect class="data" x="570" y="260" width="210" height="84" rx="10" stroke-width="1.5"/>
<text x="675" y="288" text-anchor="middle" class="h">Request</text>
<text x="675" y="309" text-anchor="middle" class="s">program · annotations · claims</text>
<text x="675" y="329" text-anchor="middle" class="s">type table</text>

<!-- stage 3 -->
<rect class="untrusted" x="850" y="60" width="340" height="64" rx="10" stroke-width="1.5"/>
<text x="1020" y="88" text-anchor="middle" class="h">Certificate producer</text>
<text x="1020" y="110" text-anchor="middle" class="s">bounded search, untrusted</text>

<rect class="data" x="920" y="170" width="200" height="50" rx="10" stroke-width="1.5"/>
<text x="1020" y="201" text-anchor="middle" class="h">Evidence</text>

<rect class="proved" x="850" y="260" width="340" height="84" rx="10" stroke-width="1.5"/>
<text x="1020" y="288" text-anchor="middle" class="h">Verifier</text>
<text x="1020" y="309" text-anchor="middle" class="s">checks the evidence against the exact request</text>
<text x="1020" y="329" text-anchor="middle" class="s">soundness proved in Lean</text>

<rect class="input" x="850" y="384" width="340" height="52" rx="10" stroke-width="1.5"/>
<text x="1020" y="406" text-anchor="middle" class="h">Verdict</text>
<text x="1020" y="426" text-anchor="middle" class="s">verified, or the failing obligation in source terms</text>

<!-- edges -->
<path class="e" d="M 230 92 L 298 92"/>
<path class="e" d="M 230 252 L 298 252"/>
<text x="264" y="240" text-anchor="middle" class="lbl">export</text>
<path class="e" d="M 500 92 C 540 92 540 160 568 160"/>
<text x="534" y="80" text-anchor="middle" class="lbl">AST</text>
<path class="e" d="M 500 252 C 540 252 540 184 568 184"/>
<path class="e" d="M 675 204 L 675 258"/>
<path class="e" d="M 780 300 L 848 300"/>
<path class="e" d="M 780 290 C 815 290 815 92 848 92"/>
<path class="e" d="M 1020 124 L 1020 168"/>
<path class="e" d="M 1020 220 L 1020 258"/>
<path class="e" d="M 1020 344 L 1020 382"/>

<!-- legend -->
<rect class="input" x="30" y="392" width="18" height="18" rx="4" stroke-width="1.5"/>
<text x="56" y="406" class="s">external input or output</text>
<rect class="reviewed" x="240" y="392" width="18" height="18" rx="4" stroke-width="1.5"/>
<text x="266" y="406" class="s">reviewed code, the trust boundary</text>
<rect class="untrusted" x="520" y="392" width="18" height="18" rx="4" stroke-width="1.5"/>
<text x="546" y="406" class="s">untrusted</text>
<rect class="proved" x="640" y="392" width="18" height="18" rx="4" stroke-width="1.5"/>
<text x="666" y="406" class="s">proved</text>
<rect class="data" x="30" y="424" width="18" height="18" rx="4" stroke-width="1.5"/>
<text x="56" y="438" class="s">data exchanged as versioned JSON</text>
</svg>

<text x="190.0" y="547.0" text-anchor="middle" class="">calculus program</text>
<text x="190.0" y="571.0" text-anchor="middle" class="">source requirements</text>
<text x="190.0" y="595.0" text-anchor="middle" class="">point annotations</text>
<path class="edge" d="M 190 213 V 490"/>
<text x="55" y="460" class="note">program + requirements</text>

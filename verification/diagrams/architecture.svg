<path class="edge" d="M 610 203 V 260"/>
<rect x="480" y="365" width="260" height="102" rx="10" fill="#fff4dc" stroke="#9a6700" stroke-width="1.5"/>
<text x="610.0" y="410.0" text-anchor="middle" class="heading">Source association</text>
<text x="610.0" y="434.0" text-anchor="middle" class="">and claim translation</text>
<path class="edge" d="M 610 318 V 365"/>
<path class="edge" d="M 340 174 H 405 V 400 H 480"/>
<text x="349" y="340" class="note">source points</text>

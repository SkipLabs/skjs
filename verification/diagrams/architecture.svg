<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1050" viewBox="0 0 800 1050" role="img" aria-labelledby="title desc">
<title id="title">Independent verification architecture</title>
<desc id="desc">Independent source extraction and associated SKJS claims form a verification request. An untrusted producer supplies derivation certificates. The proved consumer checks both the original request and certificates. Typing soundness establishes safety under the reviewed semantics. Amber marks the remaining source and model trust boundary; green marks the proved path.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1f2328; font-size: 18px; }
.heading { font-weight: 650; }
.note { font-size: 15px; fill: #57606a; }
.edge { fill: none; stroke: #57606a; stroke-width: 2; marker-end: url(#arrow); }
</style>
<rect width="800" height="1050" rx="16" fill="#ffffff"/>


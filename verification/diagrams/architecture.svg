<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1120" viewBox="0 0 1060 1120" role="img" aria-labelledby="title desc">
<title id="title">Source verification pipeline</title>
<desc id="desc">TypeScript parsing supplies Fragment syntax and declarations. Lean exports claim-independent execution plans to the OCaml producer. Lean reconstructs those plans from Fragment and elaborates the source with proposed types into a calculus request. Evidence search proposes a certificate; the checker checks it against the original request. Success establishes modeled safety. Source translation and host conformance remain reviewed assumptions.</desc>



name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches Skargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SKJS_VERSION=$(awk -F '"' '/^version *= *"/ {print $2; exit}' Skargo.toml)
          if [[ "$TAG_VERSION" != "$SKJS_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME (=> $TAG_VERSION) does not match Skargo.toml version $SKJS_VERSION"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches Skargo.toml version $SKJS_VERSION"

      - name: Package import-stubs
        run: |
          mkdir -p artifacts
          tar -czf artifacts/import-stubs.tgz -C import-stubs .
          ls -la artifacts/

      - name: Upload import-stubs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skjs-import-stubs
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: skiplabs/skip:latest
    env:
      SKIP_CAPACITY: 8G
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone Skip repository
        run: |
          git clone --depth=1 --shallow-submodules --recurse-submodules \
            https://github.com/SkipLabs/skip ../skip

      - name: Build release binary
        run: |
          skargo build --release --bin skjs
          ls -la target/host/release/

      - name: Prepare per-arch artifacts
        run: |
          mkdir -p artifacts
          PLATFORM="linux"
          ARCH="${{ matrix.arch }}"
          BINARY_NAME="skjs_${GITHUB_REF_NAME}_${PLATFORM}_${ARCH}"

          cp target/host/release/skjs "artifacts/${BINARY_NAME}"

          cat > "artifacts/${BINARY_NAME}.json" <<EOF
          {
            "name": "skjs",
            "version": "${GITHUB_REF_NAME}",
            "build_type": "release",
            "commit": "${GITHUB_SHA}",
            "tag": "${GITHUB_REF_NAME}",
            "run_id": "${GITHUB_RUN_ID}",
            "platform": "${PLATFORM}",
            "architecture": "${ARCH}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "build_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF

          ls -la artifacts/

      - name: Smoke test binary
        run: |
          BINARY="artifacts/skjs_${GITHUB_REF_NAME}_linux_${{ matrix.arch }}"
          chmod +x "$BINARY"
          "$BINARY" --version
          # A shipped binary must accept a known-good program...
          "$BINARY" check --import-stubs import-stubs .github/release-smoke/good.ts
          # ...and reject a known-bad one. A binary that accepts it must not ship.
          if "$BINARY" check --import-stubs import-stubs .github/release-smoke/bad.ts; then
            echo "FAIL: bad fixture type-checked clean on ${{ matrix.arch }}"
            exit 1
          fi
          echo "Real-check smoke passed on ${{ matrix.arch }}"

      - name: Upload arch artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skjs-linux-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloaded
          pattern: skjs-*
          merge-multiple: true

      - name: Assemble release files
        run: |
          mkdir -p artifacts
          cp "downloaded/skjs_${GITHUB_REF_NAME}_linux_amd64"      artifacts/
          cp "downloaded/skjs_${GITHUB_REF_NAME}_linux_amd64.json" artifacts/
          cp "downloaded/skjs_${GITHUB_REF_NAME}_linux_arm64"      artifacts/
          cp "downloaded/skjs_${GITHUB_REF_NAME}_linux_arm64.json" artifacts/
          cp "downloaded/import-stubs.tgz"                         artifacts/

          ( cd artifacts && sha256sum \
              "skjs_${GITHUB_REF_NAME}_linux_amd64" \
              "skjs_${GITHUB_REF_NAME}_linux_amd64.json" \
              "skjs_${GITHUB_REF_NAME}_linux_arm64" \
              "skjs_${GITHUB_REF_NAME}_linux_arm64.json" \
              import-stubs.tgz \
              > SHA256SUMS )

          ls -la artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: skjs ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/skjs_${{ github.ref_name }}_linux_amd64
            artifacts/skjs_${{ github.ref_name }}_linux_amd64.json
            artifacts/skjs_${{ github.ref_name }}_linux_arm64
            artifacts/skjs_${{ github.ref_name }}_linux_arm64.json
            artifacts/import-stubs.tgz
            artifacts/SHA256SUMS

name: arm64 test

# The release workflow builds a linux/arm64 binary but nothing ever runs the
# test suite on arm64. Exercise the full suite on arm64 for pushes to main and
# for release tags, so an arch-specific regression cannot ship unnoticed.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

concurrency:
  group: arm64-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: skiplabs/skip:latest
    env:
      SKIP_CAPACITY: 8G
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone Skip repository
        run: |
          git clone --depth=1 --shallow-submodules --recurse-submodules \
            https://github.com/SkipLabs/skip ../skip

      # Cache the dev binaries keyed on a content hash of their build inputs
      # (see bin/ci_build_cache.sh), so repeat runs skip the multi-minute
      # skargo build. Exact key only: a restored binary must have been built
      # from exactly these inputs.
      - name: Compute dev binary build cache key
        id: build-cache-key
        run: echo "key=$(bin/ci_build_cache.sh key)" >> "$GITHUB_OUTPUT"

      - name: Restore dev binary build cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/host/dev/skjs
            target/host/dev/test
          key: skjs-dev-bin-v1-${{ steps.build-cache-key.outputs.key }}

      - name: Detect dev binary build cache hit
        run: |
          if bin/ci_build_cache.sh restored; then
            echo "SKJS_PREBUILT=1" >> "$GITHUB_ENV"
            echo "build cache hit; make test will skip the skargo build"
          else
            echo "build cache miss; full skargo build"
          fi

      - name: Test
        run: make test

      # Runs only when the tests passed, so a broken binary is never cached.
      - name: Save dev binary build cache
        if: success() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/host/dev/skjs
            target/host/dev/test
          key: skjs-dev-bin-v1-${{ steps.build-cache-key.outputs.key }}

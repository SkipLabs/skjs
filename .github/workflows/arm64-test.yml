name: arm64 test

# The release workflow builds a linux/arm64 binary but nothing ever runs the
# test suite on arm64. Exercise the full suite on arm64 for pushes to main and
# for release tags, so an arch-specific regression cannot ship unnoticed.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

concurrency:
  group: arm64-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: skiplabs/skip:latest
    env:
      SKIP_CAPACITY: 8G
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Clone Skip repository
        run: |
          git clone --depth=1 --shallow-submodules --recurse-submodules \
            https://github.com/SkipLabs/skip ../skip

      - name: Test
        run: make test

version: 2.1

jobs:
  build:
    docker:
      - image: skiplabs/skdb-base:latest
    steps:
      - checkout
      - run:
          name: Clone SKDB
          command: |
            git clone --depth=1 https://github.com/SkipLabs/skdb ../skdb
            cd ../skdb && git submodule update --init --recursive
      - run:
          name: Check
          command: |
            skargo check
      - run:
          name: Tests
          command: |
            mkdir -p ~/test-results
            skargo test --jobs 8 --junitxml ~/test-results/skjs.xml
      - store_test_results:
          path: ~/test-results/skjs.xml

workflows:
  build_and_test:
    jobs:
      - build

version: 2.1

jobs:
  build:
    docker:
      -image: skiplabs/skdb-base:latest
    steps:
      - checkout
      - run:
          name: Check
          command: |
            skargo check
      - run:
          name: Tests
          command: |
            mkdir -p ~/test-results
            skargo test --jobs 8 --junitxml ~/test-results/skjs.xml
      - store_test_results:
          path: ~/test-results/skjs.xml

workflows:
  version: 2
  build_and_test:
    jobs:
      - build

version: 2.1

jobs:
  build:
    docker:
      - image: skiplabs/skip:latest
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Check code is formatted
          command: |
            make check-fmt
      - run:
          name: Check shell scripts
          command: |
            make check-sh
      - run:
          name: Clone Skip repository
          command: |
            git clone --depth=1 --shallow-submodules --recurse-submodules https://github.com/SkipLabs/skip ../skip
      - run:
          name: Check
          command: |
            skargo check
      - run:
          name: Tests
          command: |
            mkdir -p ~/test-results
            skargo test --jobs 8 --junitxml ~/test-results/skjs.xml
      - store_test_results:
          path: ~/test-results/skjs.xml

workflows:
  build_and_test:
    jobs:
      - build

version: 2.1

executors:
  skip-executor:
    docker:
      - image: skiplabs/skip:latest
    resource_class: large.gen2

jobs:
  build_and_test:
    executor: skip-executor
    steps:
      - checkout
      - run:
          name: Classify changes vs main
          command: |
            # Skip the expensive steps when the diff cannot change their
            # outcome. bin/ci_classify_changes.sh prints one of:
            #   docs-only   only docs/, root *.md, LICENSE changed
            #   infra-only  only docs/infra changed (bin/, .vibe/, .github/,
            #               scripts/, devtools/, npm/, Makefile, ...)
            #   full        anything else — the fail-safe default
            #
            # This job always runs and halts *green* on a skip, so the required
            # `ci/circleci: build` check is still reported: skipped PRs stay
            # mergeable, while code PRs keep a real build gate. A
            # path-filtering/dynamic-config setup cannot do both — it drops
            # the job entirely, so the required check never reports.
            #
            # Fail safe: every uncertain path classifies as `full` and builds.
            # We never skip a change we could not prove is docs/infra-only.
            class=$(bin/ci_classify_changes.sh 2>/dev/null) || class=full
            case "$class" in docs-only|infra-only|full) ;; *) class=full ;; esac
            echo "export SKJS_CI_CLASS=$class" >> "$BASH_ENV"
            echo "Change class vs main: $class"
            if [ "$class" = "docs-only" ]; then
              echo "Docs-only change vs main; halting green before all checks."
              circleci-agent step halt
            fi
      - run:
          name: Check code is formatted
          command: |
            make check-fmt
      - run:
          # Cloned before `make check-sh`: bin/merge-bot.sh is a wrapper around
          # ../skip/bin/merge-bot.sh, so the merge-bot selftest needs the skip
          # checkout to exist already.
          name: Clone Skip repository
          command: |
            git clone --depth=1 --shallow-submodules --recurse-submodules https://github.com/SkipLabs/skip ../skip
      - run:
          name: Check shell scripts
          command: |
            make check-sh
      - run:
          name: Skip Skip clone/build/tests for infra-only changes
          command: |
            # Infra-only changes still got the cheap checks above (they can
            # affect `make check-fmt` / `make check-sh`); the skargo build and
            # the test suite cannot be affected by them, so halt green instead
            # of scheduling them (the Skip clone above is cheap and already
            # done).
            if [ "${SKJS_CI_CLASS:-full}" = "infra-only" ]; then
              echo "Infra-only change vs main; halting green before the build and tests."
              circleci-agent step halt
            fi
      - run:
          name: Compute dev binary build cache key
          command: |
            bin/ci_build_cache.sh key > /tmp/skjs-build-key
      - restore_cache:
          keys:
            # Exact key only, no prefix fallback: a restored binary must have
            # been built from exactly these inputs (see bin/ci_build_cache.sh).
            - skjs-dev-bin-v1-{{ checksum "/tmp/skjs-build-key" }}
      - run:
          name: Detect dev binary build cache hit
          command: |
            if bin/ci_build_cache.sh restored; then
              echo 'export SKJS_PREBUILT=1' >> "$BASH_ENV"
              echo "build cache hit; make test will skip the skargo build"
            else
              echo "build cache miss; full skargo build"
            fi
      - run:
          name: Test
          command: |
            mkdir -p ~/test-results
            make test JUNITXML=~/test-results/skjs.xml
      # Default when: on_success, so a broken binary is never cached.
      - save_cache:
          key: skjs-dev-bin-v1-{{ checksum "/tmp/skjs-build-key" }}
          paths:
            - target/host/dev/skjs
            - target/host/dev/test
      - store_test_results:
          path: ~/test-results/skjs.xml

workflows:
  build_and_test:
    jobs:
      - build_and_test:
          name: build
          filters:
            branches:
              only: /.*/

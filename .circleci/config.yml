version: 2.1

executors:
  skip-executor:
    docker:
      - image: skiplabs/skip:latest
    resource_class: medium

jobs:
  build_and_test:
    executor: skip-executor
    steps:
      - checkout
      - run:
          name: Check code is formatted
          command: |
            make check-fmt
      - run:
          name: Check shell scripts
          command: |
            make check-sh
      - run:
          name: Clone Skip repository
          command: |
            git clone --depth=1 --shallow-submodules --recurse-submodules https://github.com/SkipLabs/skip ../skip
      - run:
          name: Check
          command: |
            skargo check
      - run:
          name: Tests
          command: |
            mkdir -p ~/test-results
            skargo test --jobs 8 --junitxml ~/test-results/skjs.xml
      - store_test_results:
          path: ~/test-results/skjs.xml

  build_binaries:
    executor: skip-executor
    steps:
      - checkout
      - run:
          name: Clone Skip repository
          command: |
            git clone --depth=1 --shallow-submodules --recurse-submodules https://github.com/SkipLabs/skip ../skip
      - run:
          name: Build release binary
          command: |
            skargo build --release
            echo "Checking if binary was created:"
            ls -la target/host/release/
      - run:
          name: Create artifacts directory and prepare binaries
          command: |
            mkdir -p artifacts
            
            # Determine platform and architecture
            PLATFORM="linux"
            ARCH="amd64"
            
            # Determine binary name based on build type
            if [[ -n "${CIRCLE_TAG:-}" ]]; then
              # Tag-based release build
              BINARY_NAME="skjs_${CIRCLE_TAG}_${PLATFORM}_${ARCH}"
              BUILD_TYPE="release"
              VERSION="${CIRCLE_TAG}"
            else
              # Branch-based development build with short hash
              SHORT_SHA="${CIRCLE_SHA1:0:8}"
              # Sanitize branch name by replacing slashes with underscores
              SAFE_BRANCH="${CIRCLE_BRANCH//\//_}"
              BINARY_NAME="skjs_${SHORT_SHA}_${SAFE_BRANCH}_${PLATFORM}_${ARCH}"
              BUILD_TYPE="development"
              VERSION="${CIRCLE_BRANCH}-${SHORT_SHA}"
            fi
            
            echo "Build type: $BUILD_TYPE"
            echo "Binary name: $BINARY_NAME"
            
            # Copy binary with versioned name
            cp target/host/release/skjs "artifacts/${BINARY_NAME}"
            
            # Create metadata JSON
            cat > "artifacts/${BINARY_NAME}.json" \<< EOF
            {
              "name": "skjs",
              "version": "${VERSION}",
              "build_type": "${BUILD_TYPE}",
              "commit": "${CIRCLE_SHA1}",
              "branch": "${CIRCLE_BRANCH}",
              "tag": "${CIRCLE_TAG:-}",
              "build_num": "${CIRCLE_BUILD_NUM}",
              "platform": "${PLATFORM}",
              "architecture": "${ARCH}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "job_id": "${CIRCLE_WORKFLOW_JOB_ID}",
              "build_url": "${CIRCLE_BUILD_URL}"
            }
            EOF
            
            # Create appropriate symlinks
            if [[ -n "${CIRCLE_TAG:-}" ]]; then
              # For releases, create a stable release link
              ln -sf "${BINARY_NAME}" "artifacts/skjs_release_${PLATFORM}_${ARCH}_latest"
            else
              # For development, create branch-specific link
              ln -sf "${BINARY_NAME}" "artifacts/skjs_${CIRCLE_BRANCH//\//_}_${PLATFORM}_${ARCH}_latest"
            fi
            
            # List artifacts for verification
            ls -la artifacts/
      - run:
          name: Compress import-stubs
          command: |
            tar -czf import-stubs.tgz import-stubs/
            echo "Created import-stubs.tgz"
            ls -lh import-stubs.tgz

      - run:
          name: Validate binary artifacts
          command: |
            echo "=== Binary Validation ==="
            
            # Recreate the same logic to determine binary name
            PLATFORM="linux"
            ARCH="amd64"
            
            if [[ -n "${CIRCLE_TAG:-}" ]]; then
              BINARY_NAME="skjs_${CIRCLE_TAG}_${PLATFORM}_${ARCH}"
            else
              SHORT_SHA="${CIRCLE_SHA1:0:8}"
              BINARY_NAME="skjs_${SHORT_SHA}_${CIRCLE_BRANCH//\//_}_${PLATFORM}_${ARCH}"
            fi
            
            echo "Validating binary: ${BINARY_NAME}"
            
            # Check that binary exists and is executable
            if [[ -f "artifacts/${BINARY_NAME}" ]]; then
              echo "✓ Binary file exists: ${BINARY_NAME}"
              
              # Check file permissions
              if [[ -x "artifacts/${BINARY_NAME}" ]]; then
                echo "✓ Binary is executable"
              else
                echo "✗ Binary is not executable"
                exit 1
              fi
              
              # Check file size (should be > 1MB for a real binary)
              SIZE=$(stat -c%s "artifacts/${BINARY_NAME}" 2>/dev/null || stat -f%z "artifacts/${BINARY_NAME}")
              if [[ $SIZE -gt 1048576 ]]; then
                echo "✓ Binary size looks reasonable: $(numfmt --to=iec $SIZE)"
              else
                echo "✗ Binary size too small: $(numfmt --to=iec $SIZE)"
                exit 1
              fi
              
              # Try to run binary (basic smoke test)
              echo "=== Smoke Test ==="
              if timeout 10s "./artifacts/${BINARY_NAME}" --help >/dev/null 2>&1; then
                echo "✓ Binary responds to --help"
              else
                echo "✗ Binary failed smoke test (--help)"
                exit 1
              fi
              
            else
              echo "✗ Binary file missing: ${BINARY_NAME}"
              exit 1
            fi
            
            # Check that metadata exists
            if [[ -f "artifacts/${BINARY_NAME}.json" ]]; then
              echo "✓ Metadata file exists"
              
              # Validate JSON format
              if jq . "artifacts/${BINARY_NAME}.json" >/dev/null; then
                echo "✓ Metadata is valid JSON"
                echo "Metadata contents:"
                jq . "artifacts/${BINARY_NAME}.json"
              else
                echo "✗ Metadata is invalid JSON"
                exit 1
              fi
            else
              echo "✗ Metadata file missing: ${BINARY_NAME}.json"
              exit 1
            fi
            
            echo "=== All validations passed! ==="
      - store_artifacts:
          path: artifacts/
          destination: binaries
      - store_artifacts:
          path: import-stubs.tgz

workflows:
  build_and_test:
    jobs:
      - build_and_test:
          name: build
          filters:
            tags:
              only: /.*/
            branches:
              only: /.*/
      - build_binaries:
          requires:
            - build
          filters:
            tags:
              only: /^v.*/
            branches:
              only: /.*/
version: 2.1

executors:
  skip-executor:
    docker:
      - image: skiplabs/skip:latest
    resource_class: large.gen2

jobs:
  build_and_test:
    executor: skip-executor
    steps:
      - checkout
      - run:
          name: Skip build for docs-only changes
          command: |
            # Best-effort, fail-OPEN: only skip when the change is provably
            # docs-only. main always builds; if the base cannot be determined
            # (e.g. no common history in a shallow clone) we build rather than
            # risk skipping a real change.
            if [ "$CIRCLE_BRANCH" = "main" ]; then exit 0; fi
            git fetch --quiet --depth=200 origin main 2>/dev/null || exit 0
            base=$(git merge-base HEAD FETCH_HEAD 2>/dev/null) || exit 0
            changed=$(git diff --name-only "$base" HEAD 2>/dev/null) || exit 0
            [ -z "$changed" ] && exit 0
            nondocs=$(printf '%s\n' "$changed" | grep -vE '^(docs/.*|.*\.md|LICENSE)$' || true)
            if [ -n "$nondocs" ]; then exit 0; fi
            echo "Docs-only change; skipping build. Changed files:"
            echo "$changed"
            circleci-agent step halt
      - run:
          name: Check code is formatted
          command: |
            make check-fmt
      - run:
          name: Check shell scripts
          command: |
            make check-sh
      - run:
          name: Clone Skip repository
          command: |
            git clone --depth=1 --shallow-submodules --recurse-submodules https://github.com/SkipLabs/skip ../skip
      - run:
          name: Test
          command: |
            mkdir -p ~/test-results
            if [[ -n "${CIRCLE_TAG:-}" ]]; then
              export SKARGO_PROFILE=release
              echo "Tag build: using SKARGO_PROFILE=release"
            fi
            make test JUNITXML=~/test-results/skjs.xml
      - store_test_results:
          path: ~/test-results/skjs.xml

workflows:
  build_and_test:
    jobs:
      - build_and_test:
          name: build
          filters:
            branches:
              only: /.*/

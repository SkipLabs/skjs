version: 2.1

executors:
  skip-executor:
    docker:
      - image: skiplabs/skip:latest
    resource_class: medium

jobs:
  build_and_test:
    executor: skip-executor
    steps:
      - checkout
      - run:
          name: Check code is formatted
          command: |
            make check-fmt
      - run:
          name: Check shell scripts
          command: |
            make check-sh
      - run:
          name: Clone Skip repository
          command: |
            git clone --depth=1 --shallow-submodules --recurse-submodules https://github.com/SkipLabs/skip ../skip
      - run:
          name: Check
          command: |
            skargo check
      - run:
          name: Tests
          command: |
            mkdir -p ~/test-results
            skargo test --jobs 8 --junitxml ~/test-results/skjs.xml
      - store_test_results:
          path: ~/test-results/skjs.xml

  build_binaries:
    executor: skip-executor
    steps:
      - checkout
      - run:
          name: Clone Skip repository
          command: |
            git clone --depth=1 --shallow-submodules --recurse-submodules https://github.com/SkipLabs/skip ../skip
      - run:
          name: Build release binary
          command: |
            skargo build --release
            echo "Checking if binary was created:"
            ls -la target/host/release/
      - run:
          name: Create artifacts directory and prepare binaries
          command: |
            mkdir -p artifacts
            
            # Determine platform and architecture
            PLATFORM="linux"
            ARCH="amd64"
            
            # Determine binary name based on build type
            if [[ -n "${CIRCLE_TAG:-}" ]]; then
              # Tag-based release build
              BINARY_NAME="skjs_${CIRCLE_TAG}_${PLATFORM}_${ARCH}"
              BUILD_TYPE="release"
              VERSION="${CIRCLE_TAG}"
            else
              # Branch-based development build  
              BINARY_NAME="skjs_${CIRCLE_SHA1}_${CIRCLE_BRANCH}_${PLATFORM}_${ARCH}"
              BUILD_TYPE="development"
              VERSION="${CIRCLE_BRANCH}-${CIRCLE_SHA1:0:7}"
            fi
            
            echo "Build type: $BUILD_TYPE"
            echo "Binary name: $BINARY_NAME"
            
            # Copy binary with versioned name
            cp target/host/release/skjs "artifacts/${BINARY_NAME}"
            
            # Create metadata JSON
            cat > "artifacts/${BINARY_NAME}.json" \<< EOF
            {
              "name": "skjs",
              "version": "${VERSION}",
              "build_type": "${BUILD_TYPE}",
              "commit": "${CIRCLE_SHA1}",
              "branch": "${CIRCLE_BRANCH}",
              "tag": "${CIRCLE_TAG:-}",
              "build_num": "${CIRCLE_BUILD_NUM}",
              "platform": "${PLATFORM}",
              "architecture": "${ARCH}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "job_id": "${CIRCLE_WORKFLOW_JOB_ID}",
              "build_url": "${CIRCLE_BUILD_URL}"
            }
            EOF
            
            # Create appropriate symlinks
            if [[ -n "${CIRCLE_TAG:-}" ]]; then
              # For releases, create a stable release link
              ln -sf "${BINARY_NAME}" "artifacts/skjs_release_${PLATFORM}_${ARCH}_latest"
            else
              # For development, create branch-specific link
              ln -sf "${BINARY_NAME}" "artifacts/skjs_${CIRCLE_BRANCH}_${PLATFORM}_${ARCH}_latest"
            fi
            
            # List artifacts for verification
            ls -la artifacts/
      - store_artifacts:
          path: artifacts/
          destination: binaries

workflows:
  build_and_test:
    jobs:
      - build_and_test:
          name: build
      - build_binaries:
          requires:
            - build
          filters:
            tags:
              only: /^v.*/
            branches:
              only: /.*/
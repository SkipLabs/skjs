version: 2.1

executors:
  skip-executor:
    docker:
      - image: skiplabs/skip:latest
    # Measured RAM peak ~3.7 GB of 4 GB available. If this job OOMs,
    # bump to medium+.gen2 (3 CPU / 6 GB).
    resource_class: medium.gen2

jobs:
  build_and_test:
    executor: skip-executor
    steps:
      - checkout
      - run:
          name: Check code is formatted
          command: |
            make check-fmt
      - run:
          name: Check shell scripts
          command: |
            make check-sh
      - run:
          name: Clone Skip repository
          command: |
            git clone --depth=1 --shallow-submodules --recurse-submodules https://github.com/SkipLabs/skip ../skip
      - run:
          name: Test
          command: |
            mkdir -p ~/test-results
            if [[ -n "${CIRCLE_TAG:-}" ]]; then
              export SKARGO_PROFILE=release
              echo "Tag build: using SKARGO_PROFILE=release"
            fi
            make test JUNITXML=~/test-results/skjs.xml
      - store_test_results:
          path: ~/test-results/skjs.xml

workflows:
  build_and_test:
    jobs:
      - build_and_test:
          name: build
          filters:
            branches:
              only: /.*/
